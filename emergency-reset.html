<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Reset - Pollz</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      border: 3px solid #ff0000;
      padding: 40px;
      background: #111;
    }
    h1 {
      color: #ff0000;
      font-size: 32px;
      margin-bottom: 20px;
    }
    button {
      background: #ff0000;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    button:hover {
      background: #fff;
      color: #000;
    }
    .log {
      margin-top: 20px;
      padding: 15px;
      background: #000;
      border: 1px solid #333;
      text-align: left;
      font-size: 14px;
      color: #0f0;
    }
    .success {
      color: #0f0;
    }
    .warning {
      color: #ff0000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚠️ EMERGENCY RESET</h1>
    <p>This will completely clear all data and stop the infinite loop</p>
    
    <button onclick="emergencyReset()">🔥 EMERGENCY RESET</button>
    <button onclick="closeWindow()">❌ CANCEL</button>
    
    <div id="log" class="log" style="display:none;"></div>
  </div>

  <script>
    function log(message, isSuccess = true) {
      const logEl = document.getElementById('log')
      logEl.style.display = 'block'
      const line = document.createElement('div')
      line.className = isSuccess ? 'success' : 'warning'
      line.textContent = '> ' + message
      logEl.appendChild(line)
    }

    async function emergencyReset() {
      log('🚨 STARTING EMERGENCY RESET...')
      
      try {
        // Clear ALL storage
        log('Clearing localStorage...')
        localStorage.clear()
        
        log('Clearing sessionStorage...')
        sessionStorage.clear()
        
        // Clear IndexedDB if it exists
        log('Clearing IndexedDB...')
        const databases = await indexedDB.databases()
        for (const db of databases) {
          if (db.name) {
            indexedDB.deleteDatabase(db.name)
            log(`Deleted database: ${db.name}`)
          }
        }
        
        // Clear cookies
        log('Clearing cookies...')
        document.cookie.split(";").forEach(function(c) { 
          document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
        })
        
        log('✅ ALL DATA CLEARED', true)
        log('✅ Infinite loop stopped', true)
        log('Opening app in 2 seconds...', true)
        
        setTimeout(() => {
          window.location.href = 'http://localhost:3000'
        }, 2000)
        
      } catch (error) {
        log('❌ Error: ' + error.message, false)
      }
    }

    function closeWindow() {
      window.close()
      // If window.close() doesn't work (popup blockers), navigate back
      setTimeout(() => {
        window.location.href = 'http://localhost:3000'
      }, 100)
    }
  </script>
</body>
</html>

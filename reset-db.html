<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Pollz Database</title>
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #1a1a1a;
            border: 3px solid #fff;
            padding: 40px;
            max-width: 500px;
        }
        h1 {
            color: #ff0000;
            font-size: 24px;
            margin-bottom: 20px;
        }
        button {
            background: #ff0000;
            color: #fff;
            border: 3px solid #fff;
            padding: 15px 30px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        button:hover {
            background: #fff;
            color: #ff0000;
        }
        .message {
            margin-top: 20px;
            font-size: 12px;
            line-height: 1.8;
        }
        .success {
            color: #00ff00;
        }
        .info {
            color: #ffff00;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>🔄 RESET DATABASE</h1>
        <p class="message info">This will clear all polls and user data from localStorage.</p>
        
        <button onclick="resetDatabase()">RESET NOW</button>
        <button onclick="window.close()">CANCEL</button>
        
        <div id="status" class="message"></div>
    </div>

    <script>
        function resetDatabase() {
            try {
                // Clear all localStorage
                localStorage.clear();
                
                // Show success message
                const status = document.getElementById('status');
                status.className = 'message success';
                status.innerHTML = '✅ DATABASE RESET!<br><br>Close this window and refresh your app.';
                
                console.log('Database cleared successfully!');
            } catch (error) {
                const status = document.getElementById('status');
                status.className = 'message';
                status.style.color = '#ff0000';
                status.innerHTML = '❌ ERROR: ' + error.message;
            }
        }
    </script>
</body>
</html>

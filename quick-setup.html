<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAUL - Quick Database Setup</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #0f0;
      padding: 40px;
      text-align: center;
    }
    h1 {
      color: #ff0000;
      font-size: 32px;
      margin-bottom: 30px;
    }
    button {
      background: #ff0000;
      color: #fff;
      border: none;
      padding: 20px 40px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
      font-size: 16px;
    }
    button:hover {
      background: #fff;
      color: #000;
    }
    .log {
      background: #111;
      padding: 20px;
      margin: 20px auto;
      max-width: 800px;
      border: 2px solid #333;
      text-align: left;
      max-height: 400px;
      overflow-y: auto;
    }
    .success { color: #0f0; }
    .error { color: #ff0000; }
    .info { color: #00ffff; }
  </style>
</head>
<body>
  <h1>🚀 PAUL DATABASE SETUP</h1>
  
  <div>
    <button onclick="quickSetup()">⚡ QUICK SETUP (50 POLLS)</button>
    <button onclick="clearAll()">🗑️ CLEAR DATABASE</button>
    <button onclick="openApp()">🌐 OPEN APP</button>
  </div>
  
  <div class="log" id="log"></div>

  <script>
    function log(message, type = 'info') {
      const logEl = document.getElementById('log')
      const time = new Date().toLocaleTimeString()
      const className = type
      logEl.innerHTML += `<div class="${className}">[${time}] ${message}</div>`
      logEl.scrollTop = logEl.scrollHeight
    }

    async function quickSetup() {
      log('🚀 Starting quick setup...', 'info')
      
      try {
        // Clear existing data
        localStorage.clear()
        log('✅ Cleared existing data', 'success')
        
        // Create database with users
        const database = {
          users: [
            {
              id: 'admin-1',
              name: 'Admin',
              username: '@admin',
              email: 'admin@pollz.app',
              password: '$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy',
              role: 'admin',
              avatar: 'https://ui-avatars.com/api/?name=Admin&background=ff0000&color=ffffff&size=150',
              followers: 0,
              following: 0,
              reputation: 0,
              badges: [{
                id: 'badge-admin',
                name: 'Administrator',
                description: 'System Administrator',
                icon: 'Shield',
                category: 'admin',
                rarity: 'legendary',
                earnedAt: new Date().toISOString()
              }],
              pollCount: 0,
              winRate: 0,
              joinDate: new Date().toISOString()
            },
            {
              id: 'user-john-1',
              name: 'John Doe',
              username: '@johndoe',
              email: 'john@example.com',
              password: '$2a$10$JohnDoe123HashExampleForDemoPurposesOnly',
              role: 'user',
              avatar: 'https://ui-avatars.com/api/?name=John+Doe&background=0066ff&color=ffffff&size=150',
              followers: 42,
              following: 38,
              reputation: 156,
              badges: [],
              pollCount: 0,
              winRate: 0,
              joinDate: new Date().toISOString()
            }
          ],
          polls: [],
          votes: [],
          notifications: [],
          pollHistory: []
        }
        
        log('✅ Created users', 'success')
        
        // Generate 50 polls
        const categories = ['Food', 'Technology', 'Lifestyle', 'Work', 'Entertainment', 'Sports', 'Travel', 'Education']
        const pollTemplates = {
          Food: [
            ['Pizza vs Burgers?', 'Pizza', 'Burgers'],
            ['Coffee vs Tea?', 'Coffee', 'Tea'],
            ['Sushi vs Tacos?', 'Sushi', 'Tacos'],
            ['Chocolate vs Vanilla?', 'Chocolate', 'Vanilla'],
            ['Sweet vs Savory?', 'Sweet', 'Savory']
          ],
          Technology: [
            ['iOS vs Android?', 'iOS', 'Android'],
            ['Mac vs PC?', 'Mac', 'PC'],
            ['Dark Mode vs Light Mode?', 'Dark Mode', 'Light Mode'],
            ['Tabs vs Spaces?', 'Tabs', 'Spaces'],
            ['Chrome vs Firefox?', 'Chrome', 'Firefox']
          ],
          Lifestyle: [
            ['Cats vs Dogs?', 'Cats', 'Dogs'],
            ['Beach vs Mountains?', 'Beach', 'Mountains'],
            ['Summer vs Winter?', 'Summer', 'Winter'],
            ['Morning vs Night?', 'Morning Person', 'Night Owl'],
            ['City vs Countryside?', 'City', 'Countryside']
          ],
          Work: [
            ['Work from Home vs Office?', 'Work from Home', 'Office'],
            ['Freelance vs Full-time?', 'Freelance', 'Full-time'],
            ['Email vs Slack?', 'Email', 'Slack'],
            ['Remote vs Hybrid?', 'Remote', 'Hybrid'],
            ['Startup vs Corporate?', 'Startup', 'Corporate']
          ],
          Entertainment: [
            ['Netflix vs YouTube?', 'Netflix', 'YouTube'],
            ['Movies vs TV Series?', 'Movies', 'TV Series'],
            ['Books vs Movies?', 'Books', 'Movies'],
            ['Marvel vs DC?', 'Marvel', 'DC'],
            ['Gaming vs Reading?', 'Gaming', 'Reading']
          ],
          Sports: [
            ['Football vs Basketball?', 'Football', 'Basketball'],
            ['Gym vs Home Workout?', 'Gym', 'Home'],
            ['Running vs Cycling?', 'Running', 'Cycling'],
            ['Yoga vs Pilates?', 'Yoga', 'Pilates'],
            ['Team vs Individual Sports?', 'Team', 'Individual']
          ],
          Travel: [
            ['Plane vs Train?', 'Plane', 'Train'],
            ['Hotel vs Airbnb?', 'Hotel', 'Airbnb'],
            ['Solo vs Group Travel?', 'Solo', 'Group'],
            ['Adventure vs Relaxation?', 'Adventure', 'Relaxation'],
            ['Domestic vs International?', 'Domestic', 'International']
          ],
          Education: [
            ['Online vs In-Person?', 'Online', 'In-Person'],
            ['STEM vs Humanities?', 'STEM', 'Humanities'],
            ['Theory vs Practice?', 'Theory', 'Practice'],
            ['University vs Self-Taught?', 'University', 'Self-Taught'],
            ['Group vs Solo Study?', 'Group', 'Solo']
          ]
        }
        
        const timeRanges = [
          [15, 45, 'm'],
          [1, 3, 'h'],
          [4, 12, 'h'],
          [1, 3, 'd'],
          [4, 7, 'd']
        ]
        
        const authors = ['Admin', 'John Doe']
        const authorIds = ['admin-1', 'user-john-1']
        
        const polls = []
        
        // Create 5 HOT polls
        for (let i = 0; i < 5; i++) {
          const category = categories[Math.floor(Math.random() * categories.length)]
          const template = pollTemplates[category][Math.floor(Math.random() * pollTemplates[category].length)]
          const minutes = 15 + Math.floor(Math.random() * 30)
          const optionA = 45 + Math.floor(Math.random() * 11)
          const authorIndex = Math.floor(Math.random() * 2)
          
          polls.push({
            id: `poll-hot-${i + 1}`,
            title: template[0],
            description: `${template[1]} or ${template[2]}?`,
            category: category,
            authorId: authorIds[authorIndex],
            author: authors[authorIndex],
            votesOptionA: optionA,
            votesOptionB: 100 - optionA,
            votes: 100,
            timeLeft: `${minutes}m left`,
            createdAt: new Date().toISOString(),
            expiresAt: new Date(Date.now() + minutes * 60 * 1000).toISOString(),
            isVoted: false,
            isLiked: false,
            isExpired: false,
            pollType: 'options-only',
            timerEnabled: true,
            timerDuration: minutes,
            notificationEnabled: true,
            context: `The ultimate ${category.toLowerCase()} debate`,
            arguments: {
              optionA: template[1],
              optionB: template[2]
            },
            evidence: { optionA: [], optionB: [] },
            comments: [],
            trendingScore: 200 + Math.floor(Math.random() * 100)
          })
        }
        
        // Create 45 more polls
        for (let i = 5; i < 50; i++) {
          const category = categories[Math.floor(Math.random() * categories.length)]
          const template = pollTemplates[category][Math.floor(Math.random() * pollTemplates[category].length)]
          const timeRange = timeRanges[Math.floor(Math.random() * timeRanges.length)]
          
          let minutes
          if (timeRange[2] === 'm') {
            minutes = timeRange[0] + Math.floor(Math.random() * (timeRange[1] - timeRange[0]))
          } else if (timeRange[2] === 'h') {
            minutes = (timeRange[0] + Math.floor(Math.random() * (timeRange[1] - timeRange[0]))) * 60
          } else {
            minutes = (timeRange[0] + Math.floor(Math.random() * (timeRange[1] - timeRange[0]))) * 24 * 60
          }
          
          const optionA = 10 + Math.floor(Math.random() * 81)
          const authorIndex = Math.floor(Math.random() * 2)
          
          const getTimeLeft = (mins) => {
            if (mins < 60) return `${mins}m left`
            const hrs = Math.floor(mins / 60)
            if (hrs < 24) return `${hrs}h left`
            const days = Math.floor(hrs / 24)
            return `${days}d left`
          }
          
          polls.push({
            id: `poll-${i + 1}`,
            title: template[0],
            description: `${template[1]} or ${template[2]}?`,
            category: category,
            authorId: authorIds[authorIndex],
            author: authors[authorIndex],
            votesOptionA: optionA,
            votesOptionB: 100 - optionA,
            votes: 100,
            timeLeft: getTimeLeft(minutes),
            createdAt: new Date().toISOString(),
            expiresAt: new Date(Date.now() + minutes * 60 * 1000).toISOString(),
            isVoted: false,
            isLiked: false,
            isExpired: false,
            pollType: 'options-only',
            timerEnabled: true,
            timerDuration: minutes,
            notificationEnabled: Math.random() > 0.5,
            context: `The ultimate ${category.toLowerCase()} debate`,
            arguments: {
              optionA: template[1],
              optionB: template[2]
            },
            evidence: { optionA: [], optionB: [] },
            comments: [],
            trendingScore: 50 + Math.floor(Math.random() * 250)
          })
        }
        
        database.polls = polls
        
        // Save to localStorage
        localStorage.setItem('paul-db', JSON.stringify(database))
        
        log(`✅ Created ${polls.length} polls (including 5 HOT polls)`, 'success')
        log('🎉 SETUP COMPLETE!', 'success')
        log('📊 Database Stats:', 'info')
        log(`   - Users: ${database.users.length}`, 'info')
        log(`   - Polls: ${database.polls.length}`, 'info')
        log(`   - Categories: ${categories.join(', ')}`, 'info')
        log('', 'info')
        log('🔐 Login Credentials:', 'info')
        log('   Email: admin@pollz.app', 'info')
        log('   Password: Admin@123', 'info')
        
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error')
      }
    }

    function clearAll() {
      if (confirm('⚠️ Clear all data?')) {
        localStorage.clear()
        log('🗑️ All data cleared', 'info')
      }
    }

    function openApp() {
      window.open('http://localhost:5173', '_blank')
    }

    log('🔧 PAUL Quick Setup loaded', 'success')
    log('💡 Click "QUICK SETUP" to create database with 50 polls', 'info')
  </script>
</body>
</html>

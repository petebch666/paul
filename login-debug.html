<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Debug - PAUL</title>
  <style>
    body {
      font-family: 'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', 'Consolas', 'Courier New', monospace;
      background: #000;
      color: #0f0;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #ff0000;
      border-bottom: 2px solid #ff0000;
      padding-bottom: 10px;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #333;
      background: #111;
    }
    button {
      background: #ff0000;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #fff;
      color: #000;
    }
    input {
      background: #000;
      color: #0f0;
      border: 1px solid #333;
      padding: 8px;
      font-family: inherit;
      margin: 5px;
      width: 200px;
    }
    .log {
      background: #000;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #333;
      max-height: 400px;
      overflow-y: auto;
      font-size: 12px;
    }
    .success { color: #0f0; }
    .error { color: #ff0000; }
    .warning { color: #ffff00; }
  </style>
</head>
<body>
  <h1>🐛 LOGIN DEBUG TOOL</h1>
  
  <div class="section">
    <h2>🔐 Test Login Process:</h2>
    <input type="email" id="email" placeholder="Email" value="admin@pollz.app">
    <input type="password" id="password" placeholder="Password" value="Admin@123">
    <br>
    <button onclick="testFullLogin()">🔐 TEST FULL LOGIN</button>
    <button onclick="testBcryptImport()">📦 TEST BCRYPT IMPORT</button>
    <button onclick="testSecurityUtils()">🔒 TEST SECURITY UTILS</button>
    <button onclick="simulateAppLogin()">🌐 SIMULATE APP LOGIN</button>
  </div>

  <div class="section">
    <h2>📋 Debug Log:</h2>
    <div id="log" class="log"></div>
  </div>

  <script>
    function log(message, type = 'info') {
      const logEl = document.getElementById('log')
      const line = document.createElement('div')
      line.className = type
      line.textContent = '> ' + new Date().toLocaleTimeString() + ' ' + message
      logEl.appendChild(line)
      logEl.scrollTop = logEl.scrollHeight
    }

    async function testBcryptImport() {
      log('📦 Testing bcrypt import...', 'info')
      
      try {
        // Test direct import
        const bcrypt = await import('https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.min.js')
        log('✅ Bcrypt imported successfully', 'success')
        
        // Test basic functionality
        const testPassword = 'Admin@123'
        const hash = await bcrypt.hash(testPassword, 10)
        log(`✅ Hash generated: ${hash.substring(0, 30)}...`, 'success')
        
        const isValid = await bcrypt.compare(testPassword, hash)
        log(`✅ Comparison test: ${isValid ? 'VALID' : 'INVALID'}`, 'success')
        
        // Test with admin's actual hash
        const dbData = localStorage.getItem('paul-db')
        if (dbData) {
          const db = JSON.parse(dbData)
          const admin = db.users.find(u => u.email === 'admin@pollz.app')
          if (admin) {
            const adminTest = await bcrypt.compare('Admin@123', admin.password)
            log(`🔐 Admin password test: ${adminTest ? 'VALID' : 'INVALID'}`, adminTest ? 'success' : 'error')
          }
        }
        
      } catch (error) {
        log(`❌ Bcrypt import failed: ${error.message}`, 'error')
        log(`❌ Error details: ${error.stack}`, 'error')
      }
    }

    async function testSecurityUtils() {
      log('🔒 Testing security utilities...', 'info')
      
      try {
        // Test if we can access the security module
        log('🔄 Attempting to import security utils...', 'info')
        
        // This won't work directly, but let's test the functions manually
        const testPassword = 'Admin@123'
        
        // Manual bcrypt test
        const bcrypt = await import('https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.min.js')
        const hash = await bcrypt.hash(testPassword, 10)
        const isValid = await bcrypt.compare(testPassword, hash)
        
        log(`✅ Manual bcrypt test: ${isValid ? 'VALID' : 'INVALID'}`, 'success')
        
        // Test email validation
        const email = 'admin@pollz.app'
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        const isEmailValid = emailRegex.test(email)
        log(`✅ Email validation: ${isEmailValid ? 'VALID' : 'INVALID'}`, 'success')
        
      } catch (error) {
        log(`❌ Security utils test failed: ${error.message}`, 'error')
      }
    }

    async function testFullLogin() {
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      
      log(`🔐 Testing full login process for: ${email}`, 'info')
      
      try {
        // Step 1: Check database
        const dbData = localStorage.getItem('paul-db')
        if (!dbData) {
          log('❌ Step 1: No database found', 'error')
          return
        }
        log('✅ Step 1: Database found', 'success')
        
        // Step 2: Parse database
        const db = JSON.parse(dbData)
        log('✅ Step 2: Database parsed', 'success')
        
        // Step 3: Find user
        const user = db.users.find(u => u.email === email)
        if (!user) {
          log(`❌ Step 3: User not found: ${email}`, 'error')
          log('Available users:', 'warning')
          db.users.forEach((u, i) => {
            log(`  ${i+1}. ${u.email}`, 'warning')
          })
          return
        }
        log(`✅ Step 3: User found: ${user.name}`, 'success')
        
        // Step 4: Check password exists
        if (!user.password) {
          log('❌ Step 4: User has no password', 'error')
          return
        }
        log('✅ Step 4: User has password', 'success')
        
        // Step 5: Test bcrypt
        const bcrypt = await import('https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.min.js')
        const isValid = await bcrypt.compare(password, user.password)
        
        if (isValid) {
          log('✅ Step 5: Password validation PASSED', 'success')
          log('🎉 LOGIN SHOULD SUCCEED!', 'success')
          
          // Step 6: Simulate storing user
          const { password: _, ...userWithoutPassword } = user
          localStorage.setItem('paul-user', JSON.stringify(userWithoutPassword))
          log('✅ Step 6: User stored in localStorage', 'success')
          
        } else {
          log('❌ Step 5: Password validation FAILED', 'error')
          log(`   Expected password: ${password}`, 'info')
          log(`   Stored hash: ${user.password.substring(0, 30)}...`, 'info')
        }
        
      } catch (error) {
        log(`❌ Full login test failed: ${error.message}`, 'error')
        log(`❌ Error details: ${error.stack}`, 'error')
      }
    }

    async function simulateAppLogin() {
      log('🌐 Simulating app login...', 'info')
      
      try {
        // This simulates what the app does
        const email = document.getElementById('email').value
        const password = document.getElementById('password').value
        
        // Step 1: Email validation (simplified)
        if (!email.includes('@')) {
          throw new Error('Invalid email format')
        }
        
        // Step 2: Get user from database
        const dbData = localStorage.getItem('paul-db')
        if (!dbData) {
          throw new Error('Database not found')
        }
        
        const db = JSON.parse(dbData)
        const user = db.users.find(u => u.email === email)
        if (!user) {
          throw new Error('User not found')
        }
        
        // Step 3: Password comparison
        const bcrypt = await import('https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.min.js')
        const isValid = await bcrypt.compare(password, user.password)
        
        if (!isValid) {
          throw new Error('Invalid password')
        }
        
        // Step 4: Success - store user
        const { password: _, ...userWithoutPassword } = user
        localStorage.setItem('paul-user', JSON.stringify(userWithoutPassword))
        
        log('🎉 SIMULATED LOGIN SUCCESSFUL!', 'success')
        log('✅ User stored in localStorage', 'success')
        log('💡 Try opening the app now - you should be logged in!', 'info')
        
      } catch (error) {
        log(`❌ Simulated login failed: ${error.message}`, 'error')
      }
    }

    // Auto-run basic test on load
    log('🐛 Login Debug Tool loaded', 'success')
    log('💡 Click "TEST FULL LOGIN" to debug the login process', 'info')
  </script>
</body>
</html>

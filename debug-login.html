<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Login - PAUL</title>
  <style>
    body {
      font-family: 'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', 'Consolas', 'Courier New', monospace;
      background: #000;
      color: #0f0;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #ff0000;
      border-bottom: 2px solid #ff0000;
      padding-bottom: 10px;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #333;
      background: #111;
    }
    button {
      background: #ff0000;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #fff;
      color: #000;
    }
    input {
      background: #000;
      color: #0f0;
      border: 1px solid #333;
      padding: 8px;
      font-family: inherit;
      margin: 5px;
      width: 200px;
    }
    .log {
      background: #000;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #333;
      max-height: 300px;
      overflow-y: auto;
      font-size: 12px;
    }
    .success { color: #0f0; }
    .error { color: #ff0000; }
    .warning { color: #ffff00; }
  </style>
</head>
<body>
  <h1>🔍 LOGIN DEBUG TOOL</h1>
  
  <div class="section">
    <h2>📝 Test Login:</h2>
    <input type="email" id="email" placeholder="Email" value="admin@pollz.app">
    <input type="password" id="password" placeholder="Password" value="Admin@123">
    <br>
    <button onclick="testLogin()">🔐 TEST LOGIN</button>
    <button onclick="checkDatabase()">📊 CHECK DATABASE</button>
    <button onclick="testBcrypt()">🔒 TEST BCRYPT</button>
  </div>

  <div class="section">
    <h2>📋 Debug Log:</h2>
    <div id="log" class="log"></div>
  </div>

  <script>
    function log(message, type = 'info') {
      const logEl = document.getElementById('log')
      const line = document.createElement('div')
      line.className = type
      line.textContent = '> ' + new Date().toLocaleTimeString() + ' ' + message
      logEl.appendChild(line)
      logEl.scrollTop = logEl.scrollHeight
    }

    async function testLogin() {
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      
      log(`🔐 Testing login for: ${email}`, 'info')
      
      try {
        // Check if database exists
        const dbData = localStorage.getItem('paul-db')
        if (!dbData) {
          log('❌ No database found!', 'error')
          return
        }
        
        const db = JSON.parse(dbData)
        log(`✅ Database loaded: ${db.users?.length || 0} users`, 'success')
        
        // Find user by email
        const user = db.users.find(u => u.email === email)
        if (!user) {
          log(`❌ User not found: ${email}`, 'error')
          log('Available users:', 'warning')
          db.users.forEach((u, i) => {
            log(`  ${i+1}. ${u.email} (${u.name})`, 'warning')
          })
          return
        }
        
        log(`✅ User found: ${user.name} (${user.email})`, 'success')
        log(`   Role: ${user.role}`, 'info')
        log(`   Has password: ${user.password ? 'YES' : 'NO'}`, 'info')
        log(`   Password hash: ${user.password ? user.password.substring(0, 30) + '...' : 'NONE'}`, 'info')
        
        // Test bcrypt comparison
        if (!user.password) {
          log('❌ User has no password hash!', 'error')
          return
        }
        
        // Import bcryptjs
        const bcrypt = await import('https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.min.js')
        
        const isValid = await bcrypt.compare(password, user.password)
        log(`🔒 Password comparison result: ${isValid ? 'VALID' : 'INVALID'}`, isValid ? 'success' : 'error')
        
        if (isValid) {
          log('🎉 LOGIN SHOULD SUCCEED!', 'success')
        } else {
          log('❌ LOGIN WILL FAIL - Password mismatch', 'error')
          
          // Test if it's a hash format issue
          if (user.password.startsWith('$2a$')) {
            log('✅ Password hash format looks correct (bcrypt)', 'success')
          } else {
            log('⚠️ Password hash format looks wrong', 'warning')
          }
        }
        
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error')
      }
    }

    async function testBcrypt() {
      log('🔒 Testing bcrypt functionality...', 'info')
      
      try {
        const bcrypt = await import('https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.min.js')
        
        // Test hash generation
        const testPassword = 'Admin@123'
        const hash = await bcrypt.hash(testPassword, 10)
        log(`✅ Generated hash: ${hash.substring(0, 30)}...`, 'success')
        
        // Test comparison
        const isValid = await bcrypt.compare(testPassword, hash)
        log(`✅ Hash comparison: ${isValid ? 'VALID' : 'INVALID'}`, 'success')
        
        // Test with admin's actual hash
        const dbData = localStorage.getItem('paul-db')
        if (dbData) {
          const db = JSON.parse(dbData)
          const admin = db.users.find(u => u.email === 'admin@pollz.app')
          if (admin && admin.password) {
            const adminValid = await bcrypt.compare('Admin@123', admin.password)
            log(`🔐 Admin password test: ${adminValid ? 'VALID' : 'INVALID'}`, adminValid ? 'success' : 'error')
          }
        }
        
      } catch (error) {
        log(`❌ Bcrypt error: ${error.message}`, 'error')
      }
    }

    function checkDatabase() {
      log('📊 Checking database...', 'info')
      
      const dbData = localStorage.getItem('paul-db')
      if (!dbData) {
        log('❌ No database found!', 'error')
        return
      }

      try {
        const db = JSON.parse(dbData)
        log(`✅ Users: ${db.users?.length || 0}`, 'success')
        log(`✅ Polls: ${db.polls?.length || 0}`, 'success')
        
        if (db.users) {
          log('👥 Users in database:', 'info')
          db.users.forEach((user, i) => {
            log(`  ${i+1}. ${user.name} (${user.email}) - Role: ${user.role}`, 'info')
            log(`      Password: ${user.password ? 'SET (' + user.password.substring(0, 20) + '...)' : 'NOT SET'}`, 'info')
          })
        }
        
      } catch (error) {
        log(`❌ Error reading database: ${error.message}`, 'error')
      }
    }

    // Auto-check on load
    checkDatabase()
  </script>
</body>
</html>

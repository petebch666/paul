<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Reset - Pollz Database</title>
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #1a1a1a;
            border: 3px solid #ff0000;
            padding: 40px;
            max-width: 500px;
        }
        h1 {
            color: #ff0000;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #ff0000;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            margin-top: 20px;
            font-size: 12px;
            line-height: 1.8;
            color: #00ff00;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>🔄 RESETTING DATABASE</h1>
        <div class="spinner"></div>
        <div id="status" class="message">Clearing localStorage...</div>
    </div>

    <script>
        // Auto-reset database
        setTimeout(() => {
            try {
                // Clear localStorage
                localStorage.clear();
                
                document.getElementById('status').innerHTML = '✅ Database cleared!<br><br>Opening app...';
                
                // Redirect to app after 1 second
                setTimeout(() => {
                    window.location.href = 'http://localhost:3000';
                }, 1000);
            } catch (error) {
                document.getElementById('status').innerHTML = '❌ Error: ' + error.message;
                document.getElementById('status').style.color = '#ff0000';
            }
        }, 1500);
    </script>
</body>
</html>

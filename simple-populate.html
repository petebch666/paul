    }
    button {
      background: #ff0000;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
      font-size: 16px;
    }
    button:hover {
      background: #fff;
      color: #000;
    }
    .log {
      background: #000;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #333;
      max-height: 400px;
      overflow-y: auto;
      font-size: 12px;
    }
    .success { color: #0f0; }
    .error { color: #ff0000; }
    .warning { color: #ffff00; }
  </style>

      const line = document.createElement('div')
      line.className = type
      line.textContent = '> ' + new Date().toLocaleTimeString() + ' ' + message
      logEl.appendChild(line)
      logEl.scrollTop = logEl.scrollHeight
    }

        log(`✅ Created ${database.polls.length} polls`, 'success')

        console.error('Full error:', error)
      }
    }

    function checkDatabase() {
      log('🔍 Checking database...', 'info')
      
      const rawData = localStorage.getItem('paul-db')
      if (!rawData) {
        log('❌ No database found', 'error')
        return
      }

      try {
        const db = JSON.parse(rawData)
        log(`✅ Users: ${db.users?.length || 0}`, 'success')
        log(`✅ Polls: ${db.polls?.length || 0}`, 'success')
        
        if (db.users) {
          log('👥 Users in database:', 'info')
          db.users.forEach((user, i) => {
            log(`  ${i+1}. ${user.name} (${user.email}) - Role: ${user.role}`, 'info')
          })
        }
        
        if (db.polls) {
          log('📊 Sample polls:', 'info')
          db.polls.slice(0, 3).forEach((poll, i) => {
            log(`  ${i+1}. ${poll.title}`, 'info')
          })
        }
        
      } catch (error) {
        log('❌ Error reading database: ' + error.message, 'error')
      }
    }

    // Auto-check on load
    log('🔄 Page loaded, checking for existing database...', 'info')
    checkDatabase()
  </script>
</body>

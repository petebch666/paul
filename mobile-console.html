<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Console Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #000;
      color: #0f0;
      padding: 10px;
      font-size: 12px;
    }
    
    #console {
      background: #000;
      border: 2px solid #0f0;
      padding: 10px;
      height: 90vh;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .log {
      margin-bottom: 8px;
      padding: 4px;
      border-left: 3px solid #0f0;
      padding-left: 8px;
    }
    
    .error {
      color: #f00;
      border-left-color: #f00;
    }
    
    .warn {
      color: #ff0;
      border-left-color: #ff0;
    }
    
    .success {
      color: #0ff;
      border-left-color: #0ff;
    }
    
    .timestamp {
      color: #666;
      font-size: 10px;
    }
    
    #controls {
      position: fixed;
      bottom: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
    }
    
    button {
      background: #0f0;
      color: #000;
      border: 2px solid #0f0;
      padding: 10px 15px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    
    button:active {
      background: #000;
      color: #0f0;
    }
    
    #stats {
      background: #111;
      border: 2px solid #0f0;
      padding: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .stat {
      color: #0ff;
    }
  </style>
</head>
<body>
  <div id="stats">
    <div class="stat">📊 Logs: <span id="logCount">0</span></div>
    <div class="stat">❌ Errors: <span id="errorCount">0</span></div>
    <div class="stat">✅ Success: <span id="successCount">0</span></div>
  </div>
  
  <div id="console"></div>
  
  <div id="controls">
    <button onclick="clearConsole()">CLEAR</button>
    <button onclick="copyLogs()">COPY</button>
  </div>

  <script>
    const consoleDiv = document.getElementById('console');
    let logCount = 0;
    let errorCount = 0;
    let successCount = 0;
    let allLogs = [];

    function updateStats() {
      document.getElementById('logCount').textContent = logCount;
      document.getElementById('errorCount').textContent = errorCount;
      document.getElementById('successCount').textContent = successCount;
    }

    function getTimestamp() {
      const now = new Date();
      return now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
    }

    function addLog(message, type = 'log') {
      const timestamp = getTimestamp();
      const logElement = document.createElement('div');
      logElement.className = `log ${type}`;
      
      let icon = '📝';
      if (type === 'error') {
        icon = '❌';
        errorCount++;
      } else if (type === 'warn') {
        icon = '⚠️';
      } else if (type === 'success') {
        icon = '✅';
        successCount++;
      } else if (message.includes('🔑') || message.includes('📧') || message.includes('👤')) {
        type = 'success';
        logElement.className = `log ${type}`;
      }
      
      logElement.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${icon} ${message}`;
      consoleDiv.appendChild(logElement);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
      
      logCount++;
      allLogs.push(`[${timestamp}] ${message}`);
      updateStats();
    }

    function clearConsole() {
      consoleDiv.innerHTML = '';
      allLogs = [];
      logCount = 0;
      errorCount = 0;
      successCount = 0;
      updateStats();
      addLog('Console cleared', 'log');
    }

    function copyLogs() {
      const text = allLogs.join('\n');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          addLog('Logs copied to clipboard!', 'success');
        });
      } else {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        addLog('Logs copied to clipboard!', 'success');
      }
    }

    // Override console methods
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;

    console.log = function(...args) {
      originalLog.apply(console, args);
      const message = args.map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
      ).join(' ');
      
      if (message.includes('✅') || message.includes('Success') || message.includes('successful')) {
        addLog(message, 'success');
      } else {
        addLog(message, 'log');
      }
    };

    console.error = function(...args) {
      originalError.apply(console, args);
      const message = args.map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
      ).join(' ');
      addLog(message, 'error');
    };

    console.warn = function(...args) {
      originalWarn.apply(console, args);
      const message = args.map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
      ).join(' ');
      addLog(message, 'warn');
    };

    // Catch uncaught errors
    window.addEventListener('error', (event) => {
      addLog(`Uncaught error: ${event.message} at ${event.filename}:${event.lineno}`, 'error');
    });

    window.addEventListener('unhandledrejection', (event) => {
      addLog(`Unhandled promise rejection: ${event.reason}`, 'error');
    });

    // Initial message
    addLog('🚀 Mobile Console Viewer Ready!', 'success');
    addLog('Navigate to your app to see logs here', 'log');
    addLog('', 'log');
    addLog('Testing credentials:', 'log');
    addLog('  Email: admin@pollz.app', 'log');
    addLog('  Password: Admin@123', 'log');
  </script>
</body>
</html>
